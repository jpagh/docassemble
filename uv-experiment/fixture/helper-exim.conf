# Disposable local incoming-mail topology, not arbitrary production mail routing.
primary_hostname = helper.test
domainlist local_domains = helper.test : localhost
local_interfaces = 127.0.0.1
daemon_smtp_ports = 25
spool_directory = /var/spool/exim4
# A pipe wrapper can die while its admitted guardian/handler still survives.
# Retain the original message on signals, and automatically retry after thaw.
auto_thaw = 1m
log_file_path = /var/log/exim4/%slog
acl_smtp_rcpt = local_recipient
keep_environment = DA_UV_MANAGED : DA_CONFIG_FILE : DA_MANAGED_STATE_DIR : DA_RUNTIME_VENV : PYTHONPATH
hide pgsql_servers = localhost/docassemble/docassemble/fixturepass

begin acl
local_recipient:
  accept domains = +local_domains
         condition = ${lookup pgsql {SELECT short FROM shortener WHERE short='${quote_pgsql:$local_part}'}{yes}{no}}
  deny message = Local fixture recipients only

begin routers
# The existing SQL shortener router, redirect/filter and address_pipe flow.
central_filter:
  driver = redirect
  domains = +local_domains
  file = /etc/exim4/docassemble-filter
  user = www-data
  group = www-data
  no_verify
  allow_filter
  allow_freeze
  pipe_transport = address_pipe
  condition = ${lookup pgsql {SELECT short FROM shortener WHERE short='${quote_pgsql:$local_part}'}{yes}{no}}

begin transports
address_pipe:
  driver = pipe
  return_fail_output
  # Missing/closed admission is temporary, never a successful delivery or bounce.
  temp_errors = 75
  freeze_signal = true
  # A default pipe timeout would kill an accepted long-lived handler.
  timeout = 0s
  environment = DA_UV_MANAGED=true : DA_CONFIG_FILE=/usr/share/docassemble/config/config.yml : DA_MANAGED_STATE_DIR=/var/lib/docassemble/managed : DA_RUNTIME_VENV=/usr/share/docassemble/local3.12 : PYTHONPATH=/opt/docassemble-executor/src::/opt/docassemble-fixture
  headers_add = Envelope-to: $local_part@$domain

begin retry
* * F,2h,1m; F,1d,30m

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slowfixture"
version = "0.1.0"
description = "Fixture package whose wheel build can be delayed to interrupt a frozen sync."
requires-python = ">=3.12"

[tool.setuptools]
packages = ["slowfixture"]
